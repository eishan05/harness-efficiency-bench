id: python-json-config-migration
source: local-curated
fixtures: fixtures
workspace_setup:
  git_init: true
prompt: |
  Fix the legacy JSON config migration so the included unit tests pass.
  Preserve unknown keys, do not mutate the caller's input, and remove migrated
  legacy keys from the returned config.
oracle:
  type: command
  command: "python3 -m unittest discover -s tests"
  timeout_sec: 30
budgets:
  timeout_sec: 240
perturbations:
  - id: 20k
    tokens: 20000
    seed: "irrelevant stale config migration proposal"
    placement: prompt_prefix
  - id: 50k
    tokens: 50000
    seed: "irrelevant stale config migration proposal"
    placement: prompt_prefix
  - id: 100k
    tokens: 100000
    seed: "irrelevant stale config migration proposal"
    placement: prompt_prefix
tags:
  - non-swe
  - score-facing
  - local-curated
  - python
  - bugfix
  - data-migration
