id: python-cache-ttl-lru
source: local-curated
fixtures: fixtures
workspace_setup:
  git_init: true
prompt: |
  Fix the TTL/LRU cache so the included unit tests pass.
  Expired entries should disappear on access, and successful reads should update
  LRU recency before later evictions.
oracle:
  type: command
  command: "python3 -m unittest discover -s tests"
  timeout_sec: 30
budgets:
  timeout_sec: 240
perturbations:
  - id: 20k
    tokens: 20000
    seed: "irrelevant stale cache tuning report"
    placement: prompt_prefix
  - id: 50k
    tokens: 50000
    seed: "irrelevant stale cache tuning report"
    placement: prompt_prefix
  - id: 100k
    tokens: 100000
    seed: "irrelevant stale cache tuning report"
    placement: prompt_prefix
tags:
  - non-swe
  - score-facing
  - local-curated
  - python
  - bugfix
  - stateful
