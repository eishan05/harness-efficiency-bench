id: toy-write-file
source: local
workspace_setup:
  git_init: true
prompt: |
  Create a file named answer.txt in the workspace.
  The file must contain this text; a single trailing newline is acceptable:
  hello benchmark
oracle:
  type: file_equals
  path: answer.txt
  allow_trailing_newline: true
  text: |-
    hello benchmark
budgets:
  timeout_sec: 120
perturbations:
  - id: 20k
    tokens: 20000
    seed: "irrelevant stale build log"
    placement: prompt_prefix
  - id: 50k
    tokens: 50000
    seed: "irrelevant stale build log"
    placement: prompt_prefix
  - id: 100k
    tokens: 100000
    seed: "irrelevant stale build log"
    placement: prompt_prefix
  - id: 200k
    tokens: 200000
    seed: "irrelevant stale build log"
    placement: prompt_prefix
tags:
  - smoke
  - toy
