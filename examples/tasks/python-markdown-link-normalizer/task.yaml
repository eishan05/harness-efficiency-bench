id: python-markdown-link-normalizer
source: local-curated
fixtures: fixtures
workspace_setup:
  git_init: true
prompt: |
  Fix the Markdown link normalizer so the included unit tests pass.
  Normalize relative Markdown links against the provided base URL, but do not
  rewrite links inside fenced code blocks or already-absolute links.
oracle:
  type: command
  command: "python3 -m unittest discover -s tests"
  timeout_sec: 30
budgets:
  timeout_sec: 240
perturbations:
  - id: 20k
    tokens: 20000
    seed: "irrelevant stale docs rewrite notes"
    placement: prompt_prefix
  - id: 50k
    tokens: 50000
    seed: "irrelevant stale docs rewrite notes"
    placement: prompt_prefix
  - id: 100k
    tokens: 100000
    seed: "irrelevant stale docs rewrite notes"
    placement: prompt_prefix
tags:
  - non-swe
  - score-facing
  - local-curated
  - python
  - bugfix
  - text-processing
