    tokens: 20000
    seed: "irrelevant stale plugin loading design doc"
    placement: prompt_prefix
  - id: 50k
    tokens: 50000
    seed: "irrelevant stale plugin loading design doc"
    placement: prompt_prefix
  - id: 100k
    tokens: 100000
    seed: "irrelevant stale plugin loading design doc"
    placement: prompt_prefix
tags:
