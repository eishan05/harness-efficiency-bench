id: python-plugin-registry
source: local-curated
fixtures: fixtures
workspace_setup:
  git_init: true
prompt: |
  Fix plugin discovery so the included unit tests pass.
  Discover importable modules in the package, call modules with a register()
  function, and return a fresh registry each time.
oracle:
  type: command
  command: "python3 -m unittest discover -s tests"
  timeout_sec: 30
budgets:
  timeout_sec: 240
