id: codex-local
adapter: codex
model: gpt-5.5
timeout_sec: 900
trace_mode: structured
command:
  - codex
  - exec
  - --json
  - --sandbox
  - danger-full-access
  - --skip-git-repo-check
  - --model
  - "{model}"
  - "-"
pricing:
  input_per_million: 5.00
  cached_input_per_million: 0.50
  output_per_million: 30.00
  long_context_threshold_tokens: 272000
  long_context_input_per_million: 10.00
  long_context_cached_input_per_million: 1.00
  long_context_output_per_million: 45.00
permissions:
  sandbox: danger-full-access
config:
  pricing_source: https://developers.openai.com/api/docs/models/gpt-5.5
  execution_note: host debug harness; not suitable for untrusted tasks
  codex_rollout_trace: true
