id: claude-code-go
adapter: claude_code
model: ${BENCH_MODEL}
timeout_sec: 900
trace_mode: structured
command: 'claude --bare -p --input-format text --output-format stream-json --verbose --model {model} --max-budget-usd "${{CLAUDE_MAX_BUDGET_USD:-1.00}}"
  --no-session-persistence --permission-mode bypassPermissions --allowedTools Read,Write,Edit,MultiEdit,Glob,Grep,Bash

  '
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
- docker_isolation
config:
  auth_mode: gateway
  backend: docker
  stdin_prompt: true
  docker_image: harness-bench/claude-code:2.1.329
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: '2'
  docker_read_only: true
  docker_home: /claude-home
  cli_version: 2.1.329
  version_command:
  - claude
  - --version
  docker_tmpfs:
  - /tmp:exec,size=2g,mode=1777
  - /claude-home:exec,size=512m,uid=1000,gid=1000
  docker_env_passthrough:
  - BENCH_MODEL
  - BENCH_CONTEXT_WINDOW
  - BENCH_MAX_OUTPUT_TOKENS
  - CLAUDE_MAX_BUDGET_USD
