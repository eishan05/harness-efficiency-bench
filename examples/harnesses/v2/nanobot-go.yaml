# Generated by scripts/gen_v2_manifests.py; edit that script, not this file.
id: nanobot-go
adapter: docker_agent_cli
model: ${BENCH_MODEL}
timeout_sec: 900
trace_mode: partial
command:
- /opt/harness/run-agent
- '{prompt_file}'
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
- docker_isolation
config:
  backend: docker
  docker_image: harness-bench/nanobot:0.4.1
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: '2'
  docker_read_only: true
  docker_home: /nanobot-home
  docker_tmpfs:
  - /tmp:exec,size=2g,mode=1777
  - /nanobot-home:exec,size=512m
  docker_env_passthrough:
  - BENCH_MODEL
  - BENCH_CONTEXT_WINDOW
  - BENCH_MAX_OUTPUT_TOKENS
  - NANOBOT_MAX_TOKENS
  - NANOBOT_CONTEXT_WINDOW_TOKENS
  - NANOBOT_MAX_TOOL_ITERATIONS
  - NANOBOT_MAX_TOOL_RESULT_CHARS
  - NANOBOT_TEMPERATURE
  required_env:
  - OPENCODE_GO_API_KEY
  - BENCH_MODEL
  cli_version: 0.4.1
  version_command:
  - nanobot
  - --version
  trace:
    parser: nanobot_text
    proxy:
      enabled: true
      protocol: openai_compatible
      upstream_base_url: https://opencode.ai/inference/go/openai/v1
      upstream_api_key_env: OPENCODE_GO_API_KEY
      client_api_key: proxy-holds-the-key
      base_url_env:
      - BENCH_BASE_URL
      api_key_env:
      - BENCH_API_KEY
      inject_headers:
        x-opencode-session: '{session_id}'
        User-Agent: nanobot/0.4.1 (harness-efficiency-bench)
      trace_path: ../.harness-usage-proxy.jsonl
      prefer: true
