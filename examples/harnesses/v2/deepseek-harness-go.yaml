# Generated by scripts/gen_v2_manifests.py; edit that script, not this file.
id: deepseek-harness-go
adapter: docker_agent_cli
model: ${BENCH_MODEL}
timeout_sec: 900
trace_mode: structured
command:
- /opt/harness/run-agent
- '{prompt_file}'
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
- docker_isolation
config:
  backend: docker
  docker_image: harness-bench/deepseek-harness:0.2.2rc2
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: '2'
  docker_read_only: true
  docker_home: /dsh-home
  docker_tmpfs:
  - /tmp:exec,size=2g,mode=1777
  - /dsh-home:exec,size=1g
  docker_env_passthrough:
  - BENCH_MODEL
  - BENCH_CONTEXT_WINDOW
  - BENCH_MAX_OUTPUT_TOKENS
  - DSH_BENCH_PROFILE
  required_env:
  - OPENCODE_GO_API_KEY
  - BENCH_MODEL
  cli_version: 0.2.2rc2
  version_command:
  - python
  - -c
  - import importlib.metadata as m; print(m.version('deepseek-harness-sdk'))
  trace:
    parser: none
    proxy:
      enabled: true
      protocol: anthropic_compatible
      upstream_base_url: https://opencode.ai/inference/go/anthropic
      upstream_api_key_env: OPENCODE_GO_API_KEY
      client_api_key: proxy-holds-the-key
      base_url_env:
      - DEEPSEEK_BASE_URL
      api_key_env:
      - BENCH_API_KEY
      inject_headers:
        x-opencode-session: '{session_id}'
        User-Agent: deepseek-harness/0.2.2rc2 (harness-efficiency-bench)
      trace_path: ../.harness-usage-proxy.jsonl
      prefer: true
env:
  DSH_BENCH_PROFILE: headless
