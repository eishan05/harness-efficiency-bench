# Generated by scripts/gen_v2_manifests.py; edit that script, not this file.
id: goose-go
adapter: docker_agent_cli
model: ${BENCH_MODEL}
timeout_sec: 900
trace_mode: structured
command:
- /opt/harness/run-agent
- '{prompt_file}'
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
- docker_isolation
config:
  backend: docker
  docker_image: harness-bench/goose:1.60.2
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: '2'
  docker_read_only: true
  docker_home: /goose-home
  docker_tmpfs:
  - /tmp:exec,size=2g,mode=1777
  - /goose-home:exec,size=512m
  docker_env_passthrough:
  - BENCH_MODEL
  - BENCH_CONTEXT_WINDOW
  - BENCH_MAX_OUTPUT_TOKENS
  - GOOSE_PROVIDER
  - GOOSE_MODEL
  - GOOSE_MODE
  - GOOSE_MAX_TURNS
  - GOOSE_CONTEXT_STRATEGY
  required_env:
  - OPENCODE_GO_API_KEY
  - BENCH_MODEL
  cli_version: 1.60.2
  version_command:
  - goose
  - --version
  trace:
    parser: goose_stream_json
    proxy:
      enabled: true
      protocol: openai_compatible
      upstream_base_url: https://opencode.ai/inference/go/openai
      upstream_api_key_env: OPENCODE_GO_API_KEY
      client_api_key: proxy-holds-the-key
      base_url_env:
      - BENCH_BASE_URL
      api_key_env:
      - BENCH_API_KEY
      inject_headers:
        x-opencode-session: '{session_id}'
        User-Agent: goose/1.60.2 (harness-efficiency-bench)
      trace_path: ../.harness-usage-proxy.jsonl
      prefer: true
