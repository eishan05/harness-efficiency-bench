# Generated by scripts/gen_v2_manifests.py; edit that script, not this file.
id: codex-go
adapter: codex
model: ${BENCH_MODEL}
timeout_sec: 900
trace_mode: structured
command: codex exec --json -c 'model_provider="bench"' -c 'model_providers.bench.name="Bench"' -c "model_providers.bench.base_url=\"${{BENCH_BASE_URL}}\""
  -c 'model_providers.bench.env_key="BENCH_API_KEY"' -c 'model_providers.bench.wire_api="responses"' --sandbox danger-full-access
  --skip-git-repo-check --model "${{BENCH_MODEL}}" -
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
- docker_isolation
config:
  backend: docker
  docker_image: harness-bench/codex-cli:0.171.0
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: '2'
  docker_read_only: true
  docker_home: /codex-home
  cli_version: 0.171.0
  version_command:
  - codex
  - --version
  docker_tmpfs:
  - /tmp:exec,size=2g
  - /codex-home:exec,size=512m,uid={uid},gid={gid},mode=700
  docker_env_passthrough:
  - BENCH_MODEL
  - BENCH_CONTEXT_WINDOW
  - BENCH_MAX_OUTPUT_TOKENS
  required_env:
  - OPENCODE_GO_API_KEY
  - BENCH_MODEL
  pricing_source: provider token usage only
  codex_rollout_trace: true
  trace:
    proxy:
      enabled: true
      protocol: openai_compatible
      upstream_base_url: https://opencode.ai/inference/go/openai/v1
      upstream_api_key_env: OPENCODE_GO_API_KEY
      client_api_key: proxy-holds-the-key
      base_url_env:
      - BENCH_BASE_URL
      api_key_env:
      - BENCH_API_KEY
      inject_headers:
        x-opencode-session: '{session_id}'
        User-Agent: codex/0.171.0 (harness-efficiency-bench)
      trace_path: ../.harness-usage-proxy.jsonl
      prefer: true
