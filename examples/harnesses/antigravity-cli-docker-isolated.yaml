id: antigravity-cli-docker-isolated
adapter: docker_agent_cli
model: gemini-default
timeout_sec: 900
trace_mode: partial
command:
  - /opt/harness/run-agent
  - "{prompt_file}"
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
  - docker_isolation
config:
  backend: docker
  docker_image: harness-bench/antigravity-cli:1.0.6
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: "2"
  docker_read_only: true
  docker_home: /antigravity-home
  docker_tmpfs:
    - /tmp:exec,size=2g,mode=1777
    - /antigravity-home:exec,size=512m,uid=1000,gid=1000
  docker_mounts:
    - source: ${ANTIGRAVITY_AUTH_DIR}
      target: /antigravity-home/.gemini
  docker_env_passthrough:
    - ANTIGRAVITY_RUN_COMMAND
  auth_mode: google_oauth_dedicated_docker_home
  required_env:
    - ANTIGRAVITY_AUTH_DIR
  cli_version: "1.0.6"
  version_command:
    - agy
    - --version
  trace:
    parser: antigravity_text
