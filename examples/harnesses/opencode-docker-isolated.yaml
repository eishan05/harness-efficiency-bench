id: opencode-docker-isolated
adapter: docker_agent_cli
model: openai/gpt-4o-mini
timeout_sec: 900
trace_mode: structured
command:
  - /opt/harness/run-agent
  - "{prompt_file}"
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
  - docker_isolation
config:
  backend: docker
  docker_image: harness-bench/opencode:1.16.2
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: "2"
  docker_read_only: true
  docker_home: /opencode-home
  docker_tmpfs:
    - /tmp:exec,size=2g,mode=1777
    - /opencode-home:exec,size=512m
  docker_env_passthrough:
    - OPENAI_API_KEY
    - OPENAI_BASE_URL
    - OPENCODE_MODEL
  required_env:
    - OPENAI_API_KEY
  cli_version: "1.16.2"
  version_command:
    - opencode
    - --version
  trace:
    parser: opencode_json
    proxy:
      enabled: true
      protocol: openai_compatible
      upstream_base_url: https://api.openai.com/v1
      upstream_api_key_env: OPENAI_API_KEY
      base_url_env:
        - OPENAI_BASE_URL
      api_key_env:
        - OPENAI_API_KEY
      trace_path: .harness-usage-proxy.jsonl
