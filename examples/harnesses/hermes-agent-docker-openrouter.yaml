id: hermes-agent-docker-openrouter
adapter: docker_agent_cli
model: openrouter/${OPENROUTER_MODEL}
timeout_sec: 900
trace_mode: partial
command:
  - /opt/harness/run-agent
  - "{prompt_file}"
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
  - docker_isolation
config:
  backend: docker
  docker_image: harness-bench/hermes-agent:0.16.0
  docker_network: bridge
  docker_workspace: /workspace
  docker_memory: 4g
  docker_cpus: "2"
  docker_read_only: true
  docker_home: /hermes-home
  docker_tmpfs:
    - /tmp:exec,size=2g,mode=1777
    - /hermes-home:exec,size=512m
  docker_env_passthrough:
    - OPENROUTER_API_KEY
    - OPENROUTER_MODEL
    - HERMES_TOOLSETS
  required_env:
    - OPENROUTER_API_KEY
    - OPENROUTER_MODEL
  cli_version: "0.16.0"
  version_command:
    - hermes
    - --version
  trace:
    parser: hermes_text
