id: aider-docker-openrouter
adapter: docker_agent_cli
model: openrouter/${OPENROUTER_MODEL}
timeout_sec: 900
trace_mode: partial
command:
  - /opt/harness/run-agent
  - "{prompt_file}"
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
  - docker_isolation
config:
  backend: docker
  docker_image: harness-bench/aider:0.86.2
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: "2"
  docker_read_only: true
  docker_home: /aider-home
  docker_tmpfs:
    - /tmp:exec,size=2g,mode=1777
    - /aider-home:exec,size=512m
  docker_env_passthrough:
    - OPENROUTER_API_KEY
    - OPENROUTER_MODEL
    - AIDER_MODEL
    - OPENROUTER_BASE_URL
    - AIDER_FILE_MODE
    - AIDER_MAX_FILES
    - AIDER_MAX_FILE_BYTES
    - AIDER_MAP_TOKENS
    - AIDER_MAP_REFRESH
    - AIDER_EDIT_FORMAT
    - AIDER_ARCHITECT
    - AIDER_MAX_WALL_TIME
  required_env:
    - OPENROUTER_API_KEY
    - OPENROUTER_MODEL
  cli_version: "0.86.2"
  version_command:
    - aider
    - --version
  trace:
    parser: aider_text
    litellm_log_path: .litellm-usage.jsonl
    proxy:
      enabled: true
      protocol: openai_compatible
      upstream_base_url: https://openrouter.ai/api/v1
      upstream_api_key_env: OPENROUTER_API_KEY
      base_url_env:
        - OPENROUTER_BASE_URL
      api_key_env:
        - OPENROUTER_API_KEY
      trace_path: ../.harness-usage-proxy.jsonl
