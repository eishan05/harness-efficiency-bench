id: grok-build-docker-isolated
adapter: docker_agent_cli
model: configured-in-grok-build
timeout_sec: 900
trace_mode: partial
command:
  - /opt/harness/run-agent
  - "{prompt_file}"
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
  - docker_isolation
config:
  backend: docker
  docker_image: harness-bench/grok-build:0.2.33
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: "2"
  docker_read_only: true
  docker_home: /grok-home
  docker_tmpfs:
    - /tmp:exec,size=2g,mode=1777
    - /grok-home:exec,size=512m
  docker_env_passthrough:
    - XAI_API_KEY
    - GROK_CODE_XAI_API_KEY
    - GROK_BUILD_RUN_COMMAND
    - GROK_OUTPUT_FORMAT
  required_env:
    - XAI_API_KEY
  cli_version: "0.2.33"
  version_command:
    - grok
    - --version
  trace:
    parser: grok_build_text
