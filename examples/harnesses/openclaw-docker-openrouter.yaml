id: openclaw-docker-openrouter
adapter: docker_agent_cli
model: openrouter/${OPENROUTER_MODEL}
timeout_sec: 900
trace_mode: partial
command:
  - /opt/harness/run-agent
  - "{prompt_file}"
pricing: {}
permissions:
  sandbox: docker-container
capabilities:
  - docker_isolation
config:
  backend: docker
  docker_image: harness-bench/openclaw:2026.6.1
  docker_network: bridge
  docker_workspace: /workspace
  docker_user: host
  docker_memory: 4g
  docker_cpus: "2"
  docker_read_only: true
  docker_home: /openclaw-home
  docker_tmpfs:
    - /tmp:exec,size=2g,mode=1777
    - /openclaw-home:exec,size=512m
  docker_env_passthrough:
    - OPENROUTER_API_KEY
    - OPENROUTER_MODEL
    - OPENROUTER_BASE_URL
    - OPENCLAW_TIMEOUT_SEC
    - OPENCLAW_MAX_WALL_TIME
  required_env:
    - OPENROUTER_API_KEY
    - OPENROUTER_MODEL
  cli_version: "2026.6.1"
  version_command:
    - openclaw
    - --version
  trace:
    parser: openclaw_text
    proxy:
      enabled: true
      protocol: openai_compatible
      upstream_base_url: https://openrouter.ai/api/v1
      upstream_api_key_env: OPENROUTER_API_KEY
      base_url_env:
        - OPENROUTER_BASE_URL
      api_key_env:
        - OPENROUTER_API_KEY
      trace_path: .harness-usage-proxy.jsonl
